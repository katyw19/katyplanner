<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katy · Home</title>

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem('dashboard.theme')) === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) { /* first run — light is the default */ }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 78 22 A 40 40 0 1 0 82 55' fill='none' stroke='%23C1502E' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <!-- seasonal petals + wave motif, both purely decorative and behind everything -->
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="wave-band" aria-hidden="true"></div>

  <div class="page">
    <header class="masthead">
      <svg class="enso" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M 78 22 A 40 40 0 1 0 82 55" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <p class="jp-greeting" id="jpGreeting"></p>
      <h1 class="greeting" id="greeting"></h1>
      <p class="today-date" id="todayDate"></p>
      <p class="proverb">
        <span class="proverb-jp" id="proverbJp"></span>
        <span class="proverb-en" id="proverbEn"></span>
      </p>
      <button id="themeToggle" class="theme-toggle" aria-label="Switch theme" title="Light / dark">◐</button>
    </header>

    <section class="today-strip" id="todayStrip" aria-label="Urgent today" hidden>
      <span class="strip-seal" aria-hidden="true">今日</span>
      <ul class="strip-list" id="todayStripList"></ul>
    </section>

    <main class="layout">
      <section class="todo-grid" id="todoGrid" aria-label="To-do lists"></section>

      <aside class="rail">
        <section class="panel" aria-label="Journal">
          <div class="panel-head">
            <h2 class="panel-title">Journal</h2>
            <button id="journalNew" class="ghost-btn" aria-label="New journal entry" title="New entry">＋</button>
          </div>
          <p id="journalEmpty" class="panel-note" hidden>A quiet place for longer thoughts. Only you see these.</p>
          <ul id="journalList" class="journal-list"></ul>
        </section>

        <section class="panel" aria-label="Notes">
          <h2 class="panel-title">Notes</h2>
          <textarea id="notes" class="notes" placeholder="Jot something down…" aria-label="Quick notes"></textarea>
        </section>
      </aside>
    </main>

    <footer class="page-foot">
      <button id="exportBtn" class="quiet-btn">Export data</button>
      <button id="importBtn" class="quiet-btn">Import data</button>
      <input type="file" id="importInput" accept=".json,application/json" hidden>
    </footer>
  </div>

  <!-- journal writing sheet -->
  <div id="journalOverlay" class="journal-overlay" hidden>
    <div class="journal-sheet" role="dialog" aria-label="Journal entry">
      <header class="journal-sheet-head">
        <button id="journalBack" class="ghost-btn" aria-label="Close entry" title="Close (Esc)">←</button>
        <span id="journalDate" class="journal-date"></span>
        <button id="journalDelete" class="ghost-btn" aria-label="Delete entry" title="Delete entry">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>
        </button>
      </header>

      <div class="journal-toolbar" role="toolbar" aria-label="Formatting">
        <button id="fmtBold" class="fmt-btn" title="Bold (⌘B)" aria-label="Bold"><b>B</b></button>
        <button id="fmtItalic" class="fmt-btn" title="Italic (⌘I)" aria-label="Italic"><i>I</i></button>
        <button id="fmtList" class="fmt-btn" title="Bulleted list" aria-label="Bulleted list">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        </button>
        <button id="fmtLink" class="fmt-btn" title="Insert link (⌘K)" aria-label="Insert link">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
      </div>

      <div id="linkPop" class="link-pop" hidden>
        <input id="linkText" class="link-input" placeholder="Text" aria-label="Link text">
        <input id="linkUrl" class="link-input" placeholder="Link (https://…)" aria-label="Link address">
        <button id="linkApply" class="link-apply">Link</button>
        <button id="linkOpen" class="ghost-btn" title="Open link" aria-label="Open link" hidden>↗</button>
        <button id="linkRemove" class="ghost-btn" title="Remove link" aria-label="Remove link" hidden>×</button>
      </div>

      <input id="journalTitle" class="journal-title" placeholder="Title…" aria-label="Entry title">
      <div id="journalBody" class="journal-body" contenteditable="true" data-placeholder="Write freely…" role="textbox" aria-multiline="true" aria-label="Entry text"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
